# Site config for the gateway. Copied to /etc/nginx/conf.d/default.conf, so it
# is included inside the image's main http { } block.

# The backend container(s). Compose's DNS resolves "api".
upstream api {
    server api:5000;
}

# Needed to pass WebSocket upgrades through
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Keep the original scheme when a TLS proxy (Caddy in production) is in front,
# so the backend builds https:// URLs (e.g. the Google OAuth callback)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # React Router: unknown paths like /dashboard -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a hash in these filenames, so they never change -> cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://api;
        # $http_host keeps the port (localhost:8080); $host would drop it and
        # break the Google OAuth callback URL
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Matches the backend's 1mb JSON limit
        client_max_body_size 1m;
    }

    location /ws {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        # Keep idle sockets open while a submission is being judged
        proxy_read_timeout 1h;
    }
}
