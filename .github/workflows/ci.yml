name: CI

on:
  push:
    branches: [main]
  
  pull_request:
    branches: [main]

permissions:
  contents: read


concurrency:
  group: ci-${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true


jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      
      - name: Setup CI dependeicncies
        run: npm ci
       
      - name: Run tests
        run: npm test
  

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm
            cache-dependency-path: client/package-lock.json
        - name: Setup CI dependencies
          run: npm ci
        - name: Run tests
          run: npm test
        
        - name: Build frontend
          run: npm run build



        




