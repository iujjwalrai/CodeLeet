name: Publish images

# Called by ci.yml after all test jobs pass on a push to main, so broken code
# is never published. Each image is tagged :latest and :<7-char commit SHA>.
on:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: CI-${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: codeleet-api
            context: backend
            file: backend/Dockerfile
            target: api
          - name: codeleet-worker
            context: backend
            file: backend/Dockerfile
            target: worker
          - name: codeleet-gateway
            context: client
            file: client/Dockerfile
          - name: codeleet-cpp
            context: backend/docker
            file: backend/docker/Dockerfile.cpp
          - name: codeleet-java
            context: backend/docker
            file: backend/docker/Dockerfile.java
    steps:
      - name: Checkout the commit CI tested
        uses: actions/checkout@v4

      # QEMU lets the amd64 runner build arm64 images
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}"
          echo "tags=${image}:latest,${image}:${SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
